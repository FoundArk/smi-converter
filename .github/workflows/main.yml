'@ | Out-File -Encoding utf8 smi_editor.py

```
  - name: Build EXE
    run: |
      pyinstaller ^
        --noconfirm ^
        --clean ^
        --onefile ^
        --windowed ^
        --collect-all tkinterdnd2 ^
        smi_editor.py

  - name: Create ZIP
    shell: powershell
    run: |
      Compress-Archive -Path "dist\*" -DestinationPath "SMI_Editor.zip"

  - name: Upload Artifact
    uses: actions/upload-artifact@v4
    with:
      name: SMI_Editor
      path: SMI_Editor.zip

  - name: Create Release
    uses: softprops/action-gh-release@v2
    with:
      tag_name: auto-build
      name: Auto Build
      files: SMI_Editor.zip
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
