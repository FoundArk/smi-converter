name: Build SMI Editor
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyinstaller tkinterdnd2
      - name: Build EXE
        run: pyinstaller --noconsole --onefile --collect-all tkinterdnd2 editor.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Professional_SMI_Editor
          path: dist/editor.exe
