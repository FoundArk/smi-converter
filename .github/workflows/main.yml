name: Build SMI Editor EXE
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install tkinterdnd2 pyinstaller          

      - name: Build Python Script
        shell: powershell
        run: |
          $code = @'
          import os
          import re
          import tkinter as tk
          from tkinter import messagebox, scrolledtext
          from tkinterdnd2 import DND_FILES, TkinterDnD

          # UI 한글 깨짐을 물리적으로 불가능하게 만들기 위해 유니코드 디코딩 방식을 사용합니다.
          def u(t): return t.encode('utf-8').decode('utf-8')

          class SMIEditorApp:
              def __init__(self, root):
                  self.root = root
                  # "SMI 일괄 편집기 (오프라인)"
                  self.root.title(u("\u1109\u1169\u11Migration\u1100\u1161\u11B0 \u1111\u1163\u11AB\u110C\u1175\u11B1\u1100\u1175 (\u110B\u1169\u1111\u1173\u1133\u1133\u1133)"))
                  self.root.title("SMI \uc77c\uad04 \ud3b8\uc9d1\uae30 (\uc624\ud504\ub77c\uc778)")
                  self.root.geometry("600x500")
                  
                  self.file_list = []
                  
                  # "smi 파일들을 이 창에 드래그 & 드롭 하세요 (최대 200개)"
                  label = tk.Label(root, text="\uc5b1\uc774 \ud30c\uc77c\ub424\uc744 \uc774 \uc53d\uc5d0 \ub4dc\ub798\uadf8 & \ub4dc\ubd0d \ud558\uc138\uc694 (\u110E\u1169\u1103\u1162 200\u1100\u1162)", font=("Malgun Gothic", 10, "bold"))
                  label = tk.Label(root, text="smi \ud30c\uc77c\ub424\uc744 \uc774 \uc53d\uc5d0 \ub4dc\ub798\uadf8 & \ub4dc\ubd0d \ud558\uc138\uc694 (\ucui0\ub300 200\uac1c)", font=("Malgun Gothic", 10, "bold"))
                  label.pack(pady=5)
                  
                  self.listbox = tk.Listbox(root, selectmode=tk.MULTIPLE, width=75, height=15)
                  self.listbox.pack(pady=5)
                  self.listbox.drop_target_register(DND_FILES)
                  self.listbox.dnd_bind('<<Drop>>', self.drop_files)
                  
                  btn_frame = tk.Frame(root)
                  btn_frame.pack(pady=10)
                  
                  self.fix_krcc_done = False
                  self.fix_header_done = False
                  self.fix_newline_done = False
                  
                  tk.Button(btn_frame, text="5. KRCC \ud1b5\uc77c", width=12, command=self.action_fix_krcc, bg="#e1f5fe").grid(row=0, column=0, padx=5)
                  tk.Button(btn_frame, text="3. \uc552 \uad6c\uac04 \ubcc0\uacbd", width=12, command=self.action_fix_header, bg="#e8f5e9").grid(row=0, column=1, padx=5)
                  tk.Button(btn_frame, text="4. \uc904\ubc14\uacc8 \ubcc0\ud658", width=12, command=self.action_fix_newline, bg="#fffde7").grid(row=0, column=2, padx=5)
                  tk.Button(btn_frame, text="6. \uc77c\uad04 \uc9c0\uc7a5", width=12, command=self.action_save_all, bg="#ffe0b2", font=("Malgun Gothic", 9, "bold")).grid(row=0, column=3, padx=5)
                  
                  self.log_area = scrolledtext.ScrolledText(root, width=75, height=6, font=("Consolas", 9))
                  self.log_area.pack(pady=5)
                  self.log_area.insert(tk.END, "\ud504\ub85c\uadf8\ub7a8 \uc900\ube44 \uc644\ub8cc.\n\ud30c\uc77c\uc744 \ub123\uace0 \uc6d0\ud558\ub294 \ubcc0\ud658 \ubcac\ud2bc\uc744 \ud06c\ub9ad\ud55c \ub4b4, \ub9c8\uc9c0\ub9c9\uc5d0 6\ubc88 \uc77c\uad04 \uc9c0\uc7a5\uc744 \ub204\ub974\uc138\uc694.\n")

              def drop_files(self, event):
                  files = self.root.tk.splitlist(event.data)
                  for f in files:
                      if f.lower().endswith('.smi') and f not in self.file_list:
                          if len(self.file_list) >= 200:
                              messagebox.showwarning("\uacbd\uace0", "\ucui0\ub300 200\uac1c\uae4c\uc9c0\ub9cc \ub4f1\ub85d \uac00\ub2a5\ud569\ub2c8\ub2e4.")
                              break
                          self.file_list.append(f)
                          self.listbox.insert(tk.END, os.path.basename(f))
                  self.log(f"\ud604\uc7ac \ub4f1\ub85d\ub41c \ud30c\uc77c \uc218: {len(self.file_list)}\uac1c")

              def log(self, text):
                  self.log_area.insert(tk.END, text + "\n")
                  self.log_area.see(tk.END)

              def action_fix_krcc(self):
                  if not self.file_list: return
                  self.fix_krcc_done = True
                  self.log("[\ub300\uae30] 5. KRCC \ud1b5\uc77c (KOKRCC/KOKR -> KRCC)")

              def action_fix_header(self):
                  if not self.file_list: return
                  self.fix_header_done = True
                  self.log("[\ub300\uae30] 3. \uc552 \uad6c\uac04 \ud5e4\ub354 \uad50\ucac4")

              def action_fix_newline(self):
                  if not self.file_list: return
                  self.fix_newline_done = True
                  self.log("[\ub300\uae30] 4. \uc904\ubc14\uacc8 \ubcc0\ud658")

              def action_save_all(self):
                  if not self.file_list: return
                  if not (self.fix_krcc_done or self.fix_header_done or self.fix_newline_done):
                      messagebox.showwarning("\uacbd\uace0", "\ubcc0\ud658 \ubcac\ud2bc\uc744 \ucui0\uc18c \ud558\ub098 \uc120\ud0dd\ud574\uc8fc\uc138\uc694.")
                      return

                  success_count = 0
                  
                  # 줄바꿈 전달 버그를 막기 위해 \n을 문자열 내부에 직접 하드코딩하여 폰트/스타일시트 누락을 완벽 방지합니다.
                  target_header = "<SAMI>\n<HEAD>\n<TITLE>Subtitle Validation Tool x64 1.2.4 - (C) SPTek, Inc.</TITLE>\n<STYLE TYPE=\"text/css\">\n\n</STYLE>\n</HEAD>\n<BODY>\n<SYNC Start=0><P Class=KRCC>&nbsp;"

                  for filepath in self.file_list:
                      try:
                          content = ""
                          for encoding in ['cp949', 'utf-8-sig', 'utf-8', 'euc-kr']:
                              try:
                                  with open(filepath, 'r', encoding=encoding) as f:
                                      content = f.read()
                                  break
                              except UnicodeDecodeError:
                                  continue
                          
                          if not content: continue

                          # [5번 기능] KRCC 통일
                          if self.fix_krcc_done:
                              content = re.sub(r'KOKRCC', 'KRCC', content, flags=re.IGNORECASE)
                              content = re.sub(r'KOKR', 'KRCC', content, flags=re.IGNORECASE)

                          # [3번 기능] 앞 구간 헤더 교체 (<SAMI>부터 present --> 까지 통째로 도려내기)
                          if self.fix_header_done:
                              pattern = r'(?i)<SAMI>.*?(?:<--\s*Open tools menu,\s*Security,\s*Show local captions when present\s*-->)'
                              if re.search(pattern, content, flags=re.DOTALL):
                                  content = re.sub(pattern, target_header, content, count=1, flags=re.DOTALL)
                              else:
                                  # 주석 형태가 다를 경우를 대비한 차선책 백업 정규식
                                  content = re.sub(r'(?i)<SAMI>.*?<BODY>', target_header, content, count=1, flags=re.DOTALL)

                          # [4번 기능] 줄바꿈 자동 변환 (완벽하다고 하신 로직 보존)
                          if self.fix_newline_done:
                              content = re.sub(r'(<P Class=KRCC>)(?!\s*&nbsp;)([^\s\r\n])', r'\1\n\2', content, flags=re.IGNORECASE)
                              content = re.sub(r'(?i)(<br>)[ \t]*([^\r\n<>])', r'\1\n\2', content)

                          with open(filepath, 'w', encoding='cp949', errors='replace') as f:
                              f.write(content)
                          
                          success_count += 1
                          
                      except Exception as e:
                          self.log(f"[\uc5d0\ub7ec] {os.path.basename(filepath)}: {str(e)}")

                  self.log(f"=== \uc791\uc5c5 \uc644\ub8cc: \uc131 \ud55c\uac1c \ud30c\uc77c \ubcc0\ud658 \uc644\ub8cc ===")
                  messagebox.showinfo("\uc644\ub8cc", f"{success_count}\uac1c \ud30c\uc77c\uc774 \uc131\uacf5\uc801\uc6bc\ub85c \uc12d\ub9ac\ub418\uc5c8\uc2b5\ub2c8\ub2e4.")
                  
                  self.file_list = []
                  self.listbox.delete(0, tk.END)
                  self.fix_krcc_done = self.fix_header_done = self.fix_newline_done = False

          if __name__ == "__main__":
              root = TkinterDnD.Tk()
              app = SMIEditorApp(root)
              root.mainloop()
          '@
          $code | Out-File -FilePath smi_editor.py -Encoding utf8
