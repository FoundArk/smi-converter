```
      Set-Content -Path smi_editor.py -Value $code -Encoding UTF8

  - name: Build EXE
    shell: powershell
    run: |
      pyinstaller --noconfirm --clean --onefile --windowed --collect-all tkinterdnd2 smi_editor.py

  - name: Upload EXE
    uses: actions/upload-artifact@v4
    with:
      name: SMI_EDITOR_EXE
      path: dist/smi_editor.exe
