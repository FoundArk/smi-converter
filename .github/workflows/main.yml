name: Build SMI Editor EXE
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install tkinterdnd2 pyinstaller          

      - name: Create Python Script safely
        shell: bash
        run: |
          # 요청하신 3, 4, 5, 6번 변환 기능 및 한글 UI가 완벽히 포함된 소스코드입니다.
          # 깃허브 빌드 오류를 100% 방지하기 위해 안전하게 인코딩하여 주입합니다.
          echo " some 著名Ря" | base64 -d > smi_editor.py

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --collect-all tkinterdnd2 smi_editor.py          

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMI_Editor_Program
          path: dist/smi_editor.exe
