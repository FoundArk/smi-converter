name: Build SMI Editor EXE
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install tkinterdnd2 pyinstaller          

      - name: Build Python Script
        shell: powershell
        run: |
          $code = @'
          import os
          import re
          import tkinter as tk
          from tkinter import messagebox, scrolledtext
          from tkinterdnd2 import DND_FILES, TkinterDnD

          # 가상 서버 충돌을 막기 위해 100% 안전한 영문 바이트 조합으로 한글을 복원합니다.
          def get_kr(byte_data):
              return byte_data.decode('utf-8')

          class SMIEditorApp:
              def __init__(self, root):
                  self.root = root
                  # "SMI 일괄 편집기 (오프라인)"
                  self.root.title(get_kr(b'SMI \xec\x9d\xbc\xea\xb2\xb0 \xed\x83\x85\xec\xa7\x91\xea\xb8\xb0 (\xec\x98\xa4\xed\x94\x84\xeb\x9d\xbc\xec\x9d\xb8)'))
                  self.root.geometry("600x500")
                  
                  self.file_list = []
                  
                  # "smi 파일들을 이 창에 드래그 & 드롭 하세요 (최대 200개)"
                  lbl_text = get_kr(b'smi \xed\x83\x8c\xec\x9d\xbc\xeb\x93\xa4\xec\x9d\x84 \xec\x9d\xb4 \xec\xb0\xbd\xec\x9d\x90 \xeb\x93\x9c\xeb\x9e\x98\xea\xb7\xb8 & \xeb\x93\x9c\xeb\xb1\xad \xed\x95\x98\xec\x84\xb8\xec\x9a\x94 (\xec\xb5\x9c\xeb\x8c\x80 200\xea\xb0\x9c)')
                  label = tk.Label(root, text=lbl_text, font=("Malgun Gothic", 10, "bold"))
                  label.pack(pady=5)
                  
                  self.listbox = tk.Listbox(root, selectmode=tk.MULTIPLE, width=75, height=15)
                  self.listbox.pack(pady=5)
                  self.listbox.drop_target_register(DND_FILES)
                  self.listbox.dnd_bind('<<Drop>>', self.drop_files)
                  
                  btn_frame = tk.Frame(root)
                  btn_frame.pack(pady=10)
                  
                  self.fix_krcc_done = False
                  self.fix_header_done = False
                  self.fix_newline_done = False
                  
                  # "5. KRCC 통일", "3. 앞 구간 변경", "4. 줄바꿈 변환", "6. 일괄 저장"
                  tk.Button(btn_frame, text=get_kr(b'5. KRCC \xed\x86\xb5\xec\x9d\xbc'), width=12, command=self.action_fix_krcc, bg="#e1f5fe").grid(row=0, column=0, padx=5)
                  tk.Button(btn_frame, text=get_kr(b'3. \xec\x95\x95 \xea\xb5\xac\xea\xb0\x84 \xeb\xb3\x80\xea\xb2\xbd'), width=12, command=self.action_fix_header, bg="#e8f5e9").grid(row=0, column=1, padx=5)
                  tk.Button(btn_frame, text=get_kr(b'4. \xec\xa5\xbc\xeb\xb0\x94\xea\xbf\x88 \xeb\xb3\x80\xed\x99\x98'), width=12, command=self.action_fix_newline, bg="#fffde7").grid(row=0, column=2, padx=5)
                  tk.Button(btn_frame, text=get_kr(b'6. \xec\x9d\xbc\xea\xb2\xb0 \xec\xa0\x80\xec\x9e\xa5'), width=12, command=self.action_save_all, bg="#ffe0b2", font=("Malgun Gothic", 9, "bold")).grid(row=0, column=3, padx=5)
                  
                  self.log_area = scrolledtext.ScrolledText(root, width=75, height=6, font=("Consolas", 9))
                  self.log_area.pack(pady=5)
                  
                  # "프로그램 준비 완료. 파일들을 넣고 원하는 변환 버튼을 클릭한 뒤, 마지막에 6번 일괄 저장을 누르세요."
                  init_log = get_kr(b'\xed\x94\x84\xeb\xa1\x9c\xea\xb7\xb8\xeb\x9e\xa8 \xec\xa4\x80\xeb\xb9\x84 \xec\x99\x84\xeb\xa1\xac.\n\xed\x83\x8c\xec\x9d\xbc\xec\x9d\x84 \xeb\x84\xa3\xea\xb3\xa0 \xec\x9d\x90\xed\x95\x98\xeb\x8a\x94 \xeb\xb3\x80\xed\x99\x98 \xeb\xb2\xbc\xed\x8a\xbc\xec\x9d\x84 \xed\x81\xb4\xeb\xa6\xad\xed\x
