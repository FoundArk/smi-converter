name: Build SMI Editor EXE
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install tkinterdnd2 pyinstaller          

      - name: Create Python Script Safely
        shell: powershell
        run: |
          # 파워쉘의 텍스트 검열 및 이스케이프 버그를 원천 차단하기 위해 
          # 각 라인을 파워쉘 배열로 안전하게 전달한 뒤, 파이썬 파일로 저장합니다.
          $code = @()
          $code += "import os"
          $code += "import re"
          $code += "import tkinter as tk"
          $code += "from tkinter import messagebox, scrolledtext"
          $code += "from tkinterdnd2 import DND_FILES, TkinterDnD"
          $code += ""
          $code += "class SMIEditorApp:"
          $code += "    def __init__(self, root):"
          $code += "        self.root = root"
          $code += "        self.root.title('SMI Batch Editor (Offline)')"
          $code += "        self.root.geometry('600x500')"
          $code += "        self.file_list = []"
          $code += "        label = tk.Label(root, text='Drag & Drop SMI files here (Max 200 files)', font=('Arial', 10, 'bold'))"
          $code += "        label.pack(pady=5)"
          $code += "        self.listbox = tk.Listbox(root, selectmode=tk.MULTIPLE, width=75, height=15)"
          $code += "        self.listbox.pack(pady=5)"
          $code += "        self.listbox.drop_target_register(DND_FILES)"
          $code += "        self.listbox.dnd_bind('<<Drop>>', self.drop_files)"
          $code += "        btn_frame = tk.Frame(root)"
          $code += "        btn_frame.pack(pady=10)"
          $code += "        self.fix_krcc_done = False"
          $code += "        self.fix_header_done = False"
          $code += "        self.fix_newline_done = False"
          $code += "        tk.Button(btn_frame, text='5. KRCC Fix', width=12, command=self.action_fix_krcc, bg='#e1f5fe').grid(row=0, column=0, padx=5)"
          $code += "        tk.Button(btn_frame, text='3. Header Fix', width=12, command=self.action_fix_header, bg='#e8f5e9').grid(row=0, column=1, padx=5)"
          $code += "        tk.Button(btn_frame, text='4. Newline Fix', width=12, command=self.action_fix_newline, bg='#fffde7').grid(row=0, column=2, padx=5)"
          $code += "        tk.Button(btn_frame, text='6. SAVE ALL', width=12, command=self.action_save_all, bg='#ffe0b2', font=('Arial', 9, 'bold')).grid(row=0, column=3, padx=5)"
          $code += "        self.log_area = scrolledtext.ScrolledText(root, width=75, height=6, font=('Consolas', 9))"
          $code += "        self.log_area.pack(pady=5)"
          $code += "        self.log_area.insert(tk.END, 'Program Ready.\n')"
          $code += ""
          $code += "    def drop_files(self, event):"
          $code += "        files = self.root.tk.splitlist(event.data)"
          $code += "        for f in files:"
          $code += "            if f.lower().endswith('.smi') and f not in self.file_list:"
          $code += "                if len(self.file_list) >= 200:"
          $code += "                    messagebox.showwarning('Warning', 'Max 200 files allowed.')"
          $code += "                    break"
          $code += "                self.file_list.append(f)"
          $code += "                self.listbox.insert(tk.END, os.path.basename(f))"
          $code += "        self.log(f'Added files: {len(self.file_list)}')"
          $code += ""
          $code += "    def log(self, text):"
          $code += "        self.log_area.insert(tk.END, text + '\n')"
          $code += "        self.log_area.see(tk.END)"
          $code += ""
          $code += "    def action_fix_krcc(self):"
          $code += "        if not self.file_list: return"
          $code += "        self.fix_krcc_done = True"
          $code += "        self.log('[Ready] 5. KRCC Fix enabled.')"
          $code += ""
          $code += "    def action_fix_header(self):"
          $code += "        if not self.file_list: return"
          $code += "        self.fix_header_done = True"
          $code += "        self.log('[Ready] 3. Header Fix enabled.')"
          $code += ""
          $code += "    def action_fix_newline(self):"
          $code += "        if not self.file_list: return"
          $code += "        self.fix_newline_done = True"
          $code += "        self.log('[Ready] 4. Newline Fix enabled.')"
          $code += ""
          $code += "    def action_save_all(self):"
          $code += "        if not self.file_list: return"
          $code += "        if not (self.fix_krcc_done or self.fix_header_done or self.fix_newline_done):"
          $code += "            messagebox.showwarning('Warning', 'Please select at least one Fix button.')"
          $code += "            return"
          $code += "        success_count = 0"
          $code += "        "
          # 1. 스타일시트 내부 주석문 및 중괄호, 맑은 고딕 개행 포맷 완벽 정의
          $code += "        target_header = '<SAMI>\\n<HEAD>\\n<TITLE>Subtitle Validation Tool x64 1.2.4 - (C) SPTek, Inc.</TITLE>\\n<STYLE TYPE=\"text/css\">\\n\\n</STYLE>\\n</HEAD>\\n<BODY>\\n<SYNC Start=0><P Class=KRCC>&nbsp;'"
          $code += ""
          $code += "        for filepath in self.file_list:"
          $code += "            try:"
          $code += "                content = ''"
          $code += "                for encoding in ['cp949', 'utf-8-sig', 'utf-8', 'euc-kr']:"
          $code += "                    try:"
          $code += "                        with open(filepath, 'r', encoding=encoding) as f:"
          $code += "                            content = f.read()"
          $code += "                        break"
          $code += "                    except UnicodeDecodeError:"
          $code += "                        continue"
          $code += "                if not content: continue"
          $code += ""
          $code += "                if self.fix_krcc_done:"
          $code += "                    content = re.sub(r'KOKRCC', 'KRCC', content, flags=re.IGNORECASE)"
          $code += "                    content = re.sub(r'KOKR', 'KRCC', content, flags=re.IGNORECASE)"
          $code += ""
          $code += "                if self.fix_header_done:"
          # 2. <SAMI>부터 시작해서 오작동을 일으키던 문제의 주석문 2줄 영역까지 통째로 잡아서 도려내는 강력한 정규식 패턴 적용
          $code += "                    pattern = r'(?is)<SAMI>.*?(?:<--\\s*Open\\s+tools\\s+menu,\\s*Security,\\s*Show\\s+local\\s+captions\\s+when\\s+present\\s*-->|<--\\s*Open\\s+play\\s+menu.*?-->\\s*<--\\s*Open\\s+tools.*?-->)'"
          $code += "                    if re.search(pattern, content):"
          $code += "                        content = re.sub(pattern, target_header, content, count=1)"
          $code += "                    else:"
          # 3. 만약 위 주석 양식이 없는 파일이더라도, <BODY> 태그 지점까지 정밀 치환 후 첫 씽크 추가 예외 처리
          $code += "                        if re.search(r'(?i)<BODY>', content):"
          $code += "                            content = re.sub(r'(?is)<SAMI>.*?<BODY>', target_header, content, count=1)"
          $code += "                        else:"
          $code += "                            content = target_header + '\\n' + content"
          $code += ""
          $code += "                if self.fix_newline_done:"
          $code += "                    content = re.sub(r'(<P Class=KRCC>)(?!\\s*&nbsp;)([^\\s\\r\\n])', r'\\1\\n\\2', content, flags=re.IGNORECASE)"
          $code += "                    content = re.sub(r'(?i)(<br>)[ \\t]*([^\\r\\n<>])', r'\\1\\n\\2', content)"
          $code += ""
          $code += "                with open(filepath, 'w', encoding='cp949', errors='replace') as f:"
          $code += "                    f.write(content)"
          $code += "                success_count += 1"
          $code += "            except Exception as e:"
          $code += "                self.log(f'[Error] {os.path.basename(filepath)}: {str(e)}')"
          $code += ""
          $code += "        self.log(f'=== SUCCESS: {success_count} files processed ===')"
          $code += "        messagebox.showinfo('Success', f'{success_count} files saved!')"
          $code += "        self.file_list = []"
          $code += "        self.listbox.delete(0, tk.END)"
          $code += "        self.fix_krcc_done = self.fix_header_done = self.fix_newline_done = False"
          $code += ""
          $code += "if __name__ == '__main__':"
          $code += "    root = TkinterDnD.Tk()"
          $code += "    app = SMIEditorApp(root)"
          $code += "    root.mainloop()"
          
          # 생성된 코드를 인코딩 유실 없이 파일로 덤프합니다.
          $code | Out-File -FilePath "$pwd\smi_editor.py" -Encoding utf8

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --collect-all tkinterdnd2 smi_editor.py          

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMI_Editor_Program
          path: dist/smi_editor.exe
