name: Build SMI Editor EXE
on: [workflow_dispatch] # 버튼을 누르면 수동으로 실행되도록 설정

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install tkinterdnd2 pyinstaller
          
      - name: Create Python Script
        shell: bash
        run: |
          cat << 'EOF' > smi_editor.py
          # 여기에 소스코드가 들어갑니다. 아래 코드를 지우지 마세요.
import os
import re
import tkinter as tk
from tkinter import messagebox, ttk
from tkinterdnd2 import DND_FILES, TkinterDnD

class SmiEditorApp:
    def __init__(self, root):
        self.root = root
        self.root.title("SMI 자막 일괄 편집기 v1.1")
        self.root.geometry("650x550")
        
        # 파일 경로와 변환된 내용을 메모리에 유지하기 위한 딕셔너리 { 파일경로: { "content": 내용, "encoding": 인코딩 } }
        self.loaded_files = {}
        # 화면 목록 순서 유지를 위한 리스트
        self.file_paths = []

        self.create_widgets()

    def create_widgets(self):
        # 상단 안내 문구
        label_info = tk.Label(self.root, text="SMI 파일들을 아래 목록창에 드래그 & 드롭 하세요. (최대 200개)", font=("맑은 고딕", 10, "bold"))
        label_info.pack(pady=10)

        # 드래그 앤 드롭 목록 창 (Listbox)
        self.listbox = tk.Listbox(self.root, selectmode=tk.EXTENDED, width=80, height=15)
        self.listbox.pack(pady=5, padx=20, fill=tk.BOTH, expand=True)

        # 드래그 앤 드롭 이벤트 등록
        self.listbox.drop_target_register(DND_FILES)
        self.listbox.dnd_bind('<<Drop>>', self.drop_files)

        # 목록 비우기 버튼
        btn_clear = tk.Button(self.root, text="목록 비우기", command=self.clear_list)
        btn_clear.pack(pady=5)

        # 기능 버튼들을 담을 프레임
        btn_frame = tk.LabelFrame(self.root, text="작업 단계 (원하는 버튼을 차례대로 클릭하세요)")
        btn_frame.pack(pady=15, padx=20, fill=tk.X)

        # 버튼 배치 (요청하신 순서대로 배치: 앞 구간 -> KRCC 통일 -> 줄바꿈 -> 일괄 저장)
        self.btn_header = tk.Button(btn_frame, text="1. 앞 구간 변경", width=13, bg="#E3F2FD", command=self.process_header)
        self.btn_header.pack(side=tk.LEFT, padx=8, pady=10)

        self.btn_krcc = tk.Button(btn_frame, text="2. KRCC 통일", width=13, bg="#E8F5E9", command=self.process_krcc)
        self.btn_krcc.pack(side=tk.LEFT, padx=8, pady=10)

        self.btn_newline = tk.Button(btn_frame, text="3. 줄바꿈 정렬", width=13, bg="#FFF3E0", command=self.process_newline)
        self.btn_newline.pack(side=tk.LEFT, padx=8, pady=10)

        self.btn_save = tk.Button(btn_frame, text="★ 일괄 저장", width=13, bg="#4CAF50", fg="white", font=("맑은 고딕", 9, "bold"), command=self.save_all_files)
        self.btn_save.pack(side=tk.RIGHT, padx=8, pady=10)

        # 하단 상태 바
        self.status_label = tk.Label(self.root, text="대기 중... 파일을 드래그앤드롭 해주세요.", bd=1, relief=tk.SUNKEN, anchor=tk.W)
        self.status_label.pack(side=tk.BOTTOM, fill=tk.X)

    def drop_files(self, event):
        files = self.root.tk.splitlist(event.data)
        added_count = 0
        
        for f_path in files:
            if f_path.lower().endswith('.smi') and f_path not in self.loaded_files:
                if len(self.loaded_files) >= 200:
                    messagebox.showwarning("경고", "최대 200개까지만 등록 가능합니다.")
                    break
                
                # 파일 인코딩 확인 및 로드
                content, enc = self.read_file_content(f_path)
                if content is not None:
                    self.loaded_files[f_path] = {"content": content, "encoding": enc}
                    self.file_paths.append(f_path)
                    self.listbox.insert(tk.END, os.path.basename(f_path))
                    added_count += 1
        
        self.status_label.config(text=f"현재 등록된 파일: {len(self.loaded_files)}개 (새로 추가됨: {added_count}개)")

    def clear_list(self):
        self.loaded_files.clear()
        self.file_paths.clear()
        self.listbox.delete(0, tk.END)
        self.status_label.config(text="대기 중... 파일을 드래그앤드롭 해주세요.")

    def read_file_content(self, file_path):
        encodings = ['utf-8', 'cp949', 'euc-kr', 'utf-16']
        for enc in encodings:
            try:
                with open(file_path, 'r', encoding=enc) as f:
                    return f.read(), enc
            except UnicodeDecodeError:
                continue
        return None, None

    # [기능 1] 앞 구간 변경 (가변적인 TITLE 대응 정규식 적용)
    def process_header(self):
        if not self.loaded_files:
            messagebox.showwarning("알림", "목록에 파일이 없습니다.")
            return

        new_header = (
            "<SAMI>\n<HEAD>\n"
            "<TITLE>Subtitle Validation Tool x64 1.2.4 - (C) SPTek, Inc.</TITLE>\n"
            "<STYLE TYPE=\"text/css\">\n\n</STYLE>\n</HEAD>\n<BODY>\n"
            "<SYNC Start=0><P Class=KRCC>&nbsp;"
        )

        success_count = 0
        # <SAMI>부터 <-- Open tools menu, Security, Show local captions when present --> 까지 매칭하는 패턴
        # 중간에 어떤 문자나 줄바꿈(TITLE 등)이 와도 상관없이 모두 찾아냅니다.
        pattern = re.compile(
            r"<SAMI>.*",
            re.DOTALL | re.IGNORECASE
        )

        for f_path in self.file_paths:
            file_data = self.loaded_files[f_path]
            content = file_data["content"]

            if pattern.search(content):
                # 기존 헤더 영역을 새 헤더로 교체
                file_data["content"] = pattern.sub(new_header, content)
                success_count += 1

        self.status_label.config(text=f"1단계 완료: {success_count}개 파일의 앞 구간을 메모리에 변환 완료.")
        messagebox.showinfo("완료", f"{success_count}개 파일의 앞 구간을 변환했습니다.\n(최종 저장을 위해 '일괄 저장' 버튼을 꼭 눌러주세요)")

    # [기능 2] KRCC 통일 (KOKRCC, KOKR -> KRCC)
    def process_krcc(self):
        if not self.loaded_files:
            messagebox.showwarning("알림", "목록에 파일이 없습니다.")
            return

        success_count = 0
        for f_path in self.file_paths:
            file_data = self.loaded_files[f_path]
            content = file_data["content"]

            # 대소문자 구분 없이 KOKRCC와 KOKR을 모두 KRCC로 변환
            modified = re.sub(r"KOKRCC", "KRCC", content, flags=re.IGNORECASE)
            modified = re.sub(r"KOKR", "KRCC", modified, flags=re.IGNORECASE)

            file_data["content"] = modified
            success_count += 1

        self.status_label.config(text=f"2단계 완료: {success_count}개 파일의 클래스를 KRCC로 메모리에 변환 완료.")
        messagebox.showinfo("완료", f"{success_count}개 파일의 언어 클래스를 KRCC로 통일했습니다.\n(최종 저장을 위해 '일괄 저장' 버튼을 꼭 눌러주세요)")

    # [기능 3] 줄바꿈 정렬
    def process_newline(self):
        if not self.loaded_files:
            messagebox.showwarning("알림", "목록에 파일이 없습니다.")
            return

        success_count = 0
        for f_path in self.file_paths:
            file_data = self.loaded_files[f_path]
            content = file_data["content"]

            # 4-1. <SYNC ...><P ...> 바로 뒤에 문자가 오면 줄바꿈 삽입 (이미 줄바꿈이 있으면 패스)
            # <P Class=KRCC> 또는 <P Class="KRCC"> 등 대소문자 및 닫는 괄호 뒤에 문자가 붙어있는 경우 처리
            content = re.sub(r"(<P[^>]*Class=['\"]?KRCC['\"]?[^>]*>)(?!\s*\n)([^\s<])", r"\1\n\2", content, flags=re.IGNORECASE)

            # 4-2. <br> 뒤에서 줄바꿈 정렬 (<br> 뒤에 공백을 제외하고 바로 줄바꿈이 없는 경우 줄바꿈 강제 삽입)
            content = re.sub(r"(<br\s*/?>)(?!\s*\n)", r"\1\n", content, flags=re.IGNORECASE)

            file_data["content"] = content
            success_count += 1

        self.status_label.config(text=f"3단계 완료: {success_count}개 파일의 줄바꿈을 메모리에 정렬 완료.")
        messagebox.showinfo("완료", f"{success_count}개 파일의 줄바꿈 처리를 완료했습니다.\n(최종 저장을 위해 '일괄 저장' 버튼을 꼭 눌러주세요)")

    # [기능 4] 일괄 저장 (실제 파일 쓰기)
    def save_all_files(self):
        if not self.loaded_files:
            messagebox.showwarning("알림", "저장할 파일이 없습니다.")
            return

        saved_count = 0
        for f_path in self.file_paths:
            file_data = self.loaded_files[f_path]
            content = file_data["content"]
            enc = file_data["encoding"]

            try:
                with open(f_path, 'w', encoding=enc) as f:
                    f.write(content)
                saved_count += 1
            except Exception as e:
                print(f"파일 저장 실패 ({os.path.basename(f_path)}): {e}")

        self.status_label.config(text=f"최종 완료: {saved_count}개의 파일이 원본에 성공적으로 덮어쓰기 저장되었습니다.")
        messagebox.showinfo("저장 완료", f"모든 변환 작업이 {saved_count}개의 원본 파일에 성공적으로 일괄 저장되었습니다!")
        self.clear_list()

if __name__ == "__main__":
    root = TkinterDnD.Tk()
    app = SmiEditorApp(root)
    root.mainloop()
          
          EOF
          
      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --collect-all tkinterdnd2 smi_editor.py
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMI_Editor_Program
          path: dist/smi_editor.exe
