name: Build SMI Editor EXE
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install tkinterdnd2 pyinstaller          

      - name: Build Python Script
        shell: powershell
        run: |
          $code = @'
          import os
          import re
          import tkinter as tk
          from tkinter import messagebox, scrolledtext
          from tkinterdnd2 import DND_FILES, TkinterDnD

          class SMIEditorApp:
              def __init__(self, root):
                  self.root = root
                  self.root.title("SMI \uc77c\uad04 \ud3b8\uc9d1\uae30 (\uc624\ud504\ub77c\uc778)")
                  self.root.geometry("600x500")
                  
                  self.file_list = []
                  
                  label = tk.Label(root, text="smi \ud30c\uc77c\ub424\uc744 \uc774 \uc53d\uc5d0 \ub4dc\ub798\uadf8 & \ub4dc\ubd0d \ud558\uc138\uc694 (\ucui0\ub300 200\uac1c)", font=("Malgun Gothic", 10, "bold"))
                  label.pack(pady=5)
                  
                  self.listbox = tk.Listbox(root, selectmode=tk.MULTIPLE, width=75, height=15)
                  self.listbox.pack(pady=5)
                  self.listbox.drop_target_register(DND_FILES)
                  self.listbox.dnd_bind('<<Drop>>', self.drop_files)
                  
                  btn_frame = tk.Frame(root)
                  btn_frame.pack(pady=10)
                  
                  self.fix_krcc_done = False
                  self.fix_header_done = False
                  self.fix_newline_done = False
                  
                  tk.Button(btn_frame, text="5. KRCC \ud1b5\uc77c", width=12, command=self.action_fix_krcc, bg="#e1f5fe").grid(row=0, column=0, padx=5)
                  tk.Button(btn_frame, text="3. \uc552 \uad6c\uac04 \ubcc0\uacbd", width=12, command=self.action_fix_header, bg="#e8f5e9").grid(row=0, column=1, padx=5)
                  tk.Button(btn_frame, text="4. \uc904\ubc14\uacc8 \ubcc0\ud658", width=12, command=self.action_fix_newline, bg="#fffde7").grid(row=0, column=2, padx=5)
                  tk.Button(btn_frame, text="6. \uc77c\uad04 \uc9c0\uc7a5", width=12, command=self.action_save_all, bg="#ffe0b2", font=("Malgun Gothic", 9, "bold")).grid(row=0, column=3, padx=5)
                  
                  self.log_area = scrolledtext.ScrolledText(root, width=75, height=6, font=("Consolas", 9))
                  self.log_area.pack(pady=5)
                  self.log_area.insert(tk.END, "\ud504\ub85c\uadf8\ub7a8 \uc900\ube44 \uc644\ub8cc.\n\ud30c\uc77c\uc744 \ub123\uace0 \uc6d0\ud558\ub294 \ubcc0\ud658 \ubcac\ud2bc\uc744 \ud06c\ub9ad\ud55c \ub4b4, \ub9c8\uc9c0\ub9c9\uc5d0 6\ubc88 \uc77c\uad04 \uc9c0\uc7a5\uc744 \ub204\ub974\uc138\uc694.\n")

              def drop_files(self, event):
                  files = self.root.tk.splitlist(event.data)
                  for f in files:
                      if f.lower().endswith('.smi') and f not in self.file_list:
                          if len(self.file_list) >= 200:
                              messagebox.showwarning("\uacbd\uace0", "\ucui0\ub300 200\uac1c\uae4c\uc9c0\ub9cc \ub4f1\ub85d \uac00\ub2a5\ud569\ub2c8\ub2e4.")
                              break
                          self.file_list.append(f)
                          self.listbox.insert(tk.END, os.path.basename(f))
