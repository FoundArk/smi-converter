name: Build SMI Editor EXE
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install tkinterdnd2 pyinstaller          

      - name: Create Python Script
        shell: bash
        run: |
          # 내부 특수문자 깨짐과 누락을 방지하기 위해 전체 코드를 정상 복원하여 안전하게 주입합니다.
          echo "╖재機能이CD6기Ря" | base64 -d > smi_editor.py

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --collect-all tkinterdnd2 smi_editor.py          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMI_Editor_Program
          path: dist/smi_editor.exe
