name: Build SMI Editor EXE
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install tkinterdnd2 pyinstaller          

      - name: Build Python Script
        shell: powershell
        run: |
          $code = @'
          import os
          import re
          import tkinter as tk
          from tkinter import messagebox, scrolledtext
          from tkinterdnd2 import DND_FILES, TkinterDnD

          class SMIEditorApp:
              def __init__(self, root):
                  self.root = root
                  self.root.title("SMI 일괄 편집기 (오프라인)")
                  self.root.geometry("600x500")
                  
                  self.file_list = []
                  
                  label = tk.Label(root, text="smi 파일들을 이 창에 드래그 & 드롭 하세요 (최대 200개)", font=("맑은 고딕", 10, "bold"))
                  label.pack(pady=5)
                  
                  self.listbox = tk.Listbox(root, selectmode=tk.MULTIPLE, width=75, height=15)
                  self.listbox.pack(pady=5)
                  self.listbox.drop_target_register(DND_FILES)
                  self.listbox.dnd_bind('<<Drop>>', self.drop_files)
                  
                  btn_frame = tk.Frame(root)
                  btn_frame.pack(pady=10)
                  
                  self.fix_krcc_done = False
                  self.fix_header_done = False
                  self.fix_newline_done = False
                  
                  tk.Button(btn_frame, text="5. KRCC 통일", width=12, command=self.action_fix_krcc, bg="#e1f5fe").grid(row=0, column=0, padx=5)
                  tk.Button(btn_frame, text="3. 앞 구간 변경", width=12, command=self.action_fix_header, bg="#e8f5e9").grid(row=0, column=1, padx=5)
                  tk.Button(btn_frame, text="4. 줄바꿈 변환", width=12, command=self.action_fix_newline, bg="#fffde7").grid(row=0, column=2, padx=5)
                  tk.Button(btn_frame, text="6. 일괄 저장", width=12, command=self.action_save_all, bg="#ffe0b2", font=("맑은 고딕", 9, "bold")).grid(row=0, column=3, padx=5)
                  
                  self.log_area = scrolledtext.ScrolledText(root, width=75, height=6, font=("Consolas", 9))
                  self.log_area.pack(pady=5)
                  self.log_area.insert(tk.END, "프로그램 준비 완료.\n파일을 넣고 원하는 변환 버튼을 클릭한 뒤, 마지막에 6번 일괄 저장을 누르세요.\n")

              def drop_files(self, event):
                  files = self.root.tk.splitlist(event.data)
                  for f in files:
                      if f.lower().endswith('.smi') and f not in self.file_list:
                          if len(self.file_list) >= 200:
                              messagebox.showwarning("경고", "최대 200개까지만 등록 가능합니다.")
                              break
                          self.file_list.append(f)
                          self.listbox.insert(tk.END, os.path.basename(f))
                  self.log(f"현재 등록된 파일 수: {len(self.file_list)}개")

              def log(self, text):
                  self.log_area.insert(tk.END, text + "\n")
                  self.log_area.see(tk.END)

              def action_fix_krcc(self):
                  if not self.file_list: return
                  self.fix_krcc_done = True
                  self.log("[대기] 5. KRCC 통일 (KOKRCC/KOKR -> KRCC)")

              def action_fix_header(self):
                  if not self.file_list: return
                  self.fix_header_done = True
                  self.log("[대기] 3. 앞 구간 헤더 교체")

              def action_fix_newline(self):
                  if not self.file_list: return
                  self.fix_newline_done = True
                  self.log("[대기] 4. 줄바꿈 변환")

              def action_save_all(self):
                  if not self.file_list: return
                  if not (self.fix_krcc_done or self.fix_header_done or self.fix_newline_done):
                      messagebox.showwarning("경고", "변환 버튼을 최소 하나 선택해주세요.")
                      return

                  success_count = 0
                  target_header = "<SAMI>\n<HEAD>\n<TITLE>Subtitle Validation Tool x64 1.2.4 - (C) SPTek, Inc.</TITLE>\n<STYLE TYPE=\"text/css\">\n\n</STYLE>\n</HEAD>\n<BODY>\n<SYNC Start=0><P Class=KRCC>&nbsp;"

                  for filepath in self.file_list:
                      try:
                          content = ""
                          for encoding in ['cp949', 'utf-8-sig', 'utf-8', 'euc-kr']:
                              try:
                                  with open(filepath, 'r', encoding=encoding) as f:
                                      content = f.read()
                                  break
                              except UnicodeDecodeError:
                                  continue
                          
                          if not content: continue

                          # [5번 기능] KRCC 통일
                          if self.fix_krcc_done:
                              content = re.sub(r'KOKRCC', 'KRCC', content, flags=re.IGNORECASE)
                              content = re.sub(r'KOKR', 'KRCC', content, flags=re.IGNORECASE)

                          # [3번 기능] 앞 구간 헤더 교체
                          if self.fix_header_done:
                              pattern = r'(?i)<SAMI>.*?(?:<--\s*Open tools menu,\s*Security,\s*Show local captions when present\s*-->)'
                              if re.search(pattern, content, flags=re.DOTALL):
                                  content = re.sub(pattern, target_header, content, count=1, flags=re.DOTALL)
                              else:
                                  content = re.sub(r'(?i)<SAMI>.*?<BODY>', target_header, content, count=1, flags=re.DOTALL)

                          # [4번 기능] 줄바꿈 자동 변환
                          if self.fix_newline_done:
                              content = re.sub(r'(<P Class=KRCC>)(?!\s*&nbsp;)([^\s\r\n])', r'\1\n\2', content, flags=re.IGNORECASE)
                              content = re.sub(r'(?i)(<br>)[ \t]*([^\r\n<>])', r'\1\n\2', content)

                          with open(filepath, 'w', encoding='cp949', errors='replace') as f:
                              f.write(content)
                          
                          success_count += 1
                          
                      except Exception as e:
                          self.log(f"[에러] {os.path.basename(filepath)}: {str(e)}")

                  self.log(f"=== 작업 완료: 총 {success_count}개 파일 변환 완료 ===")
                  messagebox.showinfo("완료", f"{success_count}개 파일이 성공적으로 처리되었습니다.")
                  
                  self.file_list = []
                  self.listbox.delete(0, tk.END)
                  self.fix_krcc_done = self.fix_header_done = self.fix_newline_done = False

          if __name__ == "__main__":
              root = TkinterDnD.Tk()
              app = SMIEditorApp(root)
              root.mainloop()
          '@
          # 가장 안전한 표준 UTF-8 규격으로 소스파일을 저장합니다.
          $code | Out-File -FilePath smi_editor.py -Encoding utf8

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --collect-all tkinterdnd2 smi_editor.py          

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMI_Editor_Program
          path: dist/smi_editor.exe
