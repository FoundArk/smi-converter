import os
import re
import tkinter as tk
from tkinter import messagebox, scrolledtext
from tkinterdnd2 import DND_FILES, TkinterDnD

TARGET_HEADER = """<SAMI>

<HEAD>

<TITLE>Subtitle Validation Tool x64 1.2.4 - (C) SPTek, Inc.</TITLE>

<STYLE TYPE="text/css">

<!--

P {margin-left:4pt; margin-right:4pt; margin-bottom:2pt; margin-top:2pt;
   text-align:Center; font-size:18pt; font-family: 맑은 고딕, 굴림, Arial;
   font-weight:Bold; color:white;}

.KRCC {Name:한국어; Lang:ko-KR; SAMIType:CC;}

-->

</STYLE>

</HEAD>

<BODY>

<SYNC Start=0><P Class=KRCC> 
"""

class App:

```
def __init__(self, root):

    self.root = root
    self.root.title("SMI Batch Editor")
    self.root.geometry("720x560")

    self.files = []

    label = tk.Label(
        root,
        text="Drag & Drop SMI Files (Max 200)",
        font=("Arial", 11, "bold")
    )
    label.pack(pady=5)

    self.listbox = tk.Listbox(
        root,
        width=90,
        height=18
    )
    self.listbox.pack(pady=5)

    self.listbox.drop_target_register(DND_FILES)
    self.listbox.dnd_bind("<<Drop>>", self.drop)

    btn = tk.Button(
        root,
        text="PROCESS & SAVE",
        width=30,
        height=2,
        command=self.process
    )
    btn.pack(pady=10)

    self.logbox = scrolledtext.ScrolledText(
        root,
        width=90,
        height=10
    )
    self.logbox.pack(pady=5)

    self.log("READY")

def log(self, text):
    self.logbox.insert(tk.END, text + "\n")
    self.logbox.see(tk.END)

def drop(self, event):

    dropped = self.root.tk.splitlist(event.data)

    for f in dropped:

        if not f.lower().endswith(".smi"):
            continue

        if f in self.files:
            continue

        if len(self.files) >= 200:
            messagebox.showwarning(
                "WARNING",
                "MAX 200 FILES"
            )
            break

        self.files.append(f)

        self.listbox.insert(
            tk.END,
            os.path.basename(f)
        )

    self.log(f"FILES: {len(self.files)}")

def read_text(self, path):

    encodings = [
        "utf-8-sig",
        "utf-8",
        "cp949",
        "euc-kr"
    ]

    for enc in encodings:

        try:

            with open(path, "r", encoding=enc) as f:
                return f.read()

        except:
            pass

    return None

def convert(self, text):

    # KRCC
    text = re.sub(
        r'KOKRCC|KOKR',
        'KRCC',
        text,
        flags=re.IGNORECASE
    )

    # HEADER
    if re.search(r'(?i)<BODY>', text):

        text = re.sub(
            r'(?is)<SAMI>.*?<BODY>',
            TARGET_HEADER,
            text,
            count=1
        )

    else:

        text = TARGET_HEADER + "\n" + text

    # BR normalize
    text = re.sub(
        r'(?i)<BR>',
        '<br>',
        text
    )

    # P newline
    text = re.sub(
        r'(<P Class=KRCC>)(?!\s*&nbsp;)([^\s\r\n<])',
        r'\1\n\2',
        text,
        flags=re.IGNORECASE
    )

    # nbsp newline
    text = re.sub(
        r'(&nbsp;)([^\r\n<])',
        r'\1\n\2',
        text
    )

    # br newline
    text = re.sub(
        r'(<br>)([^\r\n<])',
        r'\1\n\2',
        text,
        flags=re.IGNORECASE
    )

    # excessive newlines
    text = re.sub(
        r'\n{3,}',
        '\n\n',
        text
    )

    return text

def process(self):

    if not self.files:

        messagebox.showwarning(
            "WARNING",
            "NO FILES"
        )

        return

    success = 0

    for path in self.files:

        try:

            text = self.read_text(path)

            if not text:

                self.log(f"FAILED: {path}")

                continue

            text = self.convert(text)

            with open(
                path,
                "w",
                encoding="cp949",
                errors="replace"
            ) as f:

                f.write(text)

            success += 1

            self.log(f"DONE: {os.path.basename(path)}")

        except Exception as e:

            self.log(f"ERROR: {path}")
            self.log(str(e))

    messagebox.showinfo(
        "COMPLETE",
        f"{success} FILES PROCESSED"
    )

    self.log(f"SUCCESS: {success}")
```

