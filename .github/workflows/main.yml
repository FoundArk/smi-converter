name: Build SMI Editor EXE
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install tkinterdnd2 pyinstaller          

      - name: Create Python Script Safely
        shell: python
        run: |
          code_content = """import os
          import re
          import tkinter as tk
          from tkinter import messagebox, scrolledtext
          from tkinterdnd2 import DND_FILES, TkinterDnD

          class SMIEditorApp:
              def __init__(self, root):
                  self.root = root
                  self.root.title("SMI Batch Editor (Offline)")
                  self.root.geometry("600x500")
                  self.file_list = []
                  
                  label = tk.Label(root, text="Drag & Drop SMI files here (Max 200 files)", font=("Arial", 10, "bold"))
                  label.pack(pady=5)
                  
                  self.listbox = tk.Listbox(root, selectmode=tk.MULTIPLE, width=75, height=15)
                  self.listbox.pack(pady=5)
                  self.listbox.drop_target_register(DND_FILES)
                  self.listbox.dnd_bind('<<Drop>>', self.drop_files)
                  
                  btn_frame = tk.Frame(root)
                  btn_frame.pack(pady=10)
                  
                  self.fix_krcc_done = False
                  self.fix_header_done = False
                  self.fix_newline_done = False
                  
                  tk.Button(btn_frame, text="5. KRCC Fix", width=12, command=self.action_fix_krcc, bg="#e1f5fe").grid(row=0, column=0, padx=5)
                  tk.Button(btn_frame, text="3. Header Fix", width=12, command=self.action_fix_header, bg="#e8f5e9").grid(row=0, column=1, padx=5)
                  tk.Button(btn_frame, text="4. Newline Fix", width=12, command=self.action_fix_newline, bg="#fffde7").grid(row=0, column=2, padx=5)
                  tk.Button(btn_frame, text="6. SAVE ALL", width=12, command=self.action_save_all, bg="#ffe0b2", font=("Arial", 9, "bold")).grid(row=0, column=3, padx=5)
                  
                  self.log_area = scrolledtext.ScrolledText(root, width=75, height=6, font=("Consolas", 9))
                  self.log_area.pack(pady=5)
                  self.log_area.insert(tk.END, "Program Ready.\\n")

              def drop_files(self, event):
                  files = self.root.tk.splitlist(event.data)
                  for f in files:
                      if f.lower().endswith('.smi') and f not in self.file_list:
                          if len(self.file_list) >= 200:
                              messagebox.showwarning("Warning", "Max 200 files allowed.")
                              break
                          self.file_list.append(f)
                          self.listbox.insert(tk.END, os.path.basename(f))
                  self.log(f"Added files: {len(self.file_list)}")

              def log(self, text):
                  self.log_area.insert(tk.END, text + "\\n")
                  self.log_area.see(tk.END)

              def action_fix_krcc(self):
                  if not self.file_list: return
                  self.fix_krcc_done = True
                  self.log("[Ready] 5. KRCC Fix enabled.")

              def action_fix_header(self):
                  if not self.file_list: return
                  self.fix_header_done = True
                  self.log("[Ready] 3. Header Fix enabled.")

              def action_fix_newline(self):
                  if not self.file_list: return
                  self.fix_newline_done = True
                  self.log("[Ready] 4. Newline Fix enabled.")

              def action_save_all(self):
                  if not self.file_list: return
                  if not (self.fix_krcc_done or self.fix_header_done or self.fix_newline_done):
                      messagebox.showwarning("Warning", "Please select at least one Fix button.")
                      return
                  success_count = 0
                  
                  # [교체할 헤더] 원하시는 주석 코드가 100% 박혀있는 고정 형태
                  target_header = (
                      "<SAMI>\\n<HEAD>\\n<TITLE>Subtitle Validation Tool x64 1.2.4 - (C) SPTek, Inc.</TITLE>\\n"
                      "<STYLE TYPE=\\"text/css\\">\\n\\n</STYLE>\\n</HEAD>\\n<BODY>\\n<SYNC Start=0><P Class=KRCC>&nbsp;"
                  )

                  for filepath in self.file_list:
                      try:
                          content = ""
                          for encoding in ['cp949', 'utf-8-sig', 'utf-8', 'euc-kr']:
                              try:
                                  with open(filepath, 'r', encoding=encoding) as f:
                                      content = f.read()
                                  break
                              except UnicodeDecodeError:
                                  continue
                          if not content: continue

                          if self.fix_krcc_done:
                              content = re.sub(r'KOKRCC', 'KRCC', content, flags=re.IGNORECASE)
                              content = re.sub(r'KOKR', 'KRCC', content, flags=re.IGNORECASE)

                          if self.fix_header_done:
                              # 정규식 오작동을 피하기 위해, 원본 자막에서 지워야 할 텍스트 블록의 시작과 끝을 명
