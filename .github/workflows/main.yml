name: Build SMI Editor

on:
workflow_dispatch:

jobs:
build:
runs-on: windows-2022

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Install
    run: pip install pyinstaller tkinterdnd2

  - name: Create Python File
    shell: cmd
    run: |
      (
      echo import tkinter as tk
      echo from tkinter import messagebox
      echo root = tk.Tk()
      echo root.title("SMI Editor")
      echo messagebox.showinfo("SUCCESS","EXE BUILD SUCCESS")
      echo root.mainloop()
      ) > smi_editor.py

  - name: Build EXE
    run: pyinstaller --noconfirm --clean --onefile --windowed smi_editor.py

  - name: Upload
    uses: actions/upload-artifact@v4
    with:
      name: SMI_EDITOR_EXE
      path: dist/smi_editor.exe
```
