name: Build SMI Editor EXE
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install tkinterdnd2 pyinstaller
      
      - name: Write Python Code
        shell: python
        run: |
          with open("smi_editor.py", "w", encoding="utf-8") as f:
            f.write(r"""
import os, re, tkinter as tk
from tkinter import messagebox, scrolledtext
from tkinterdnd2 import DND_FILES, TkinterDnD

class SMIEditorApp:
    def __init__(self, root):
        self.root = root
        self.root.title("SMI Batch Editor")
        self.root.geometry("500x300")
        self.file_list = []
        tk.Label(root, text="SMI 파일을 드래그하세요").pack(pady=10)
        self.listbox = tk.Listbox(root, selectmode=tk.MULTIPLE, height=5)
        self.listbox.pack(fill='x', padx=10)
        self.listbox.drop_target_register(DND_FILES)
        self.listbox.dnd_bind('<<Drop>>', self.drop_files)
        tk.Button(root, text="모든 기능 적용 후 저장", command=self.process_all, bg="cyan").pack(pady=20)

    def drop_files(self, event):
        files = self.root.tk.splitlist(event.data)
        for f in files:
            if f.endswith('.smi'): self.file_list.append(f); self.listbox.insert(tk.END, os.path.basename(f))

    def process_all(self):
        target = "<SAMI>\n<HEAD>\n<TITLE>Subtitle Validation Tool x64 1.2.4 - (C) SPTek, Inc.</TITLE>\n<STYLE TYPE=\"text/css\">\n\n</STYLE>\n</HEAD>\n<BODY>\n<SYNC Start=0><P Class=KRCC>&nbsp;"
        for path in self.file_list:
            try:
                with open(path, 'r', encoding='cp949', errors='ignore') as f: content = f.read()
                # 1. 헤더 및 주석 교체
                content = re.sub(r'(?is)<SAMI>.*?(<--.*?-->\s*<--.*?-->|<BODY>)', target, content, count=1)
                # 2. KRCC Fix
                content = re.sub(r'KOKRCC|KOKR', 'KRCC', content, flags=re.IGNORECASE)
                # 3. Newline Fix
                content = re.sub(r'(<P Class=KRCC>)(?!\s*&nbsp;)([^ \s\r\n])', r'\1\n\2', content, flags=re.IGNORECASE)
                with open(path, 'w', encoding='cp949') as f: f.write(content)
            except: pass
        messagebox.showinfo("완료", "처리되었습니다.")

root = TkinterDnD.Tk()
SMIEditorApp(root)
root.mainloop()
""")

      - name: Build
        run: pyinstaller --noconsole --onefile --collect-all tkinterdnd2 smi_editor.py
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SMI_Editor_Full
          path: dist/smi_editor.exe
