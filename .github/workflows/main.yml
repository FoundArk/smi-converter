name: Build EXE

on:
workflow_dispatch:

jobs:
build:
runs-on: windows-2022

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Install
    run: pip install pyinstaller tkinterdnd2

  - name: Build
    run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all tkinterdnd2 smi_editor.py

  - name: Upload
    uses: actions/upload-artifact@v4
    with:
      name: SMI_EDITOR_EXE
      path: dist/smi_editor.exe
```
